name: Generate Pac-Man Contribution Animation

on:
  # Roda automaticamente a cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permite que você execute manualmente a qualquer momento
  workflow_dispatch:
  
  # Roda sempre que você fizer um push na branch principal
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Pac-Man Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # O token abaixo é gerado automaticamente pelo próprio GitHub Actions
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: github-action/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
